name: Butchies Media Center – TV-App (Android TV / Fire TV)
# Umbenannte Jellyfin-Android-TV-App (GPL-2.0, github.com/jellyfin/jellyfin-androidtv v0.19.4).
on:
  push:
    branches: [tv-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APPVER: '0.19.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -Pjellyfin.version=$APPVER
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n1)" ButchiesMediaCenterTV.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=tv-$APPVER-$(date +%Y%m%d-%H%M)
          gh release create "$TAG" ButchiesMediaCenterTV.apk -R "$GITHUB_REPOSITORY" --latest=false --target tv-app \
            --title "Butchies Media Center – TV-App $APPVER" \
            --notes "Android TV / Fire TV App für das Butchies Media Center (basiert auf Jellyfin for Android TV $APPVER, GPL-2.0). Server-Adresse: http://<NAS-IP>:8097"
