name: Butchies Media Center – Android-App (Handy/Tablet)
# Umbenannte Jellyfin-Android-App (GPL-2.0, github.com/jellyfin/jellyfin-android v2.7.3) für das Butchies Media Center.
on:
  push:
    branches: [android-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APPVER: '2.7.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen (libre = ohne Google-Dienste)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleLibreRelease \
            -Pjellyfin.version=$APPVER \
            -Pkeystore.file=$GITHUB_WORKSPACE/butchies/butchies.jks -Pkeystore.password=butchies-app \
            -Psigning.key.alias=butchies -Psigning.key.password=butchies-app
          ls -la app/build/outputs/apk/libre/release/
          cp app/build/outputs/apk/libre/release/*.apk ButchiesMediaCenter.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-$APPVER-$(date +%Y%m%d-%H%M)
          gh release create "$TAG" ButchiesMediaCenter.apk -R "$GITHUB_REPOSITORY" --latest=false --target android-app \
            --title "Butchies Media Center – Android-App $APPVER" \
            --notes "Handy/Tablet-App für das Butchies Media Center (basiert auf Jellyfin for Android $APPVER, GPL-2.0). Server-Adresse: http://<NAS-IP>:8097"
